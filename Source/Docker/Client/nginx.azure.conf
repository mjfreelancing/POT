server {
    listen 80;
    server_name localhost;

    # Document root at server scope so every location (incl. the header-only
    # PWA cache-policy locations below) inherits it.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA update policy: never serve a stale app shell / service worker / manifest,
    # but cache hashed build assets forever (their URL changes on every rebuild).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check endpoint
    location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}
