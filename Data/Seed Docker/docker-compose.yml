# ============================================================================
# POT SEED - POSTGRES COMPOSE FILE
# ============================================================================
# Provides a local PostgreSQL container used to AUTHOR the E2E seed data
# (`Source/Client/pot-react/e2e/seed/baseline.sql`).
#
# The E2E suite never connects here: each run starts its own throwaway
# Testcontainers database (port 55432) and applies the seed to it.
#
# Project name "pot-seed" appears as the container group in Docker Desktop.
#
# Usage:
#   Start:  .\Start-SeedPot.ps1
#   Stop:   docker compose -p pot-seed stop
#   Remove: docker compose -p pot-seed down
#
# Data is stored at ./postgres-data (relative to this file) and is NOT removed
# by 'docker compose down' or 'docker compose down -v' — bind mounts are never
# managed by Docker. Delete the postgres-data folder manually to wipe the data.

name: pot-seed

services:
  postgres:
    image: postgres:13
    container_name: pot-seed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: Pot
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U postgres -d Pot"
      interval: 5s
      timeout: 5s
      retries: 10
