# ============================================================================
# LOCAL POT - POSTGRES COMPOSE FILE
# ============================================================================
# Provides a local PostgreSQL container for use during Visual Studio development.
# This is the database backend when running the .NET API locally (not via Docker).
#
# Project name "pot-local" appears as the container group in Docker Desktop.
#
# Usage:
#   Start:  .\Start-LocalPot.ps1
#   Stop:   docker compose -p pot-local stop
#   Remove: docker compose -p pot-local down
#
# Data is stored at ./postgres-data (relative to this file) and is NOT removed
# by 'docker compose down' or 'docker compose down -v' — bind mounts are never
# managed by Docker. Delete the postgres-data folder manually to wipe the data.

name: pot-local

services:
  postgres:
    image: postgres:13
    container_name: pot-local-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: Pot
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U postgres -d Pot"
      interval: 5s
      timeout: 5s
      retries: 10
